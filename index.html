<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Level | Registration Form Validation</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <div class="site-wrap">
    <div class="container">

      <header class="site-header">
        <h1>
          Registration Form Validation
          <i class="bi bi-person-plus-fill"></i>
        </h1>
        <p class="subtitle">Advanced Level &mdash; Full Stack Development Lab, Experiment 3</p>
      </header>

      <div class="panel">

        <div id="successMsg" class="success-msg hidden">
          <strong>Registration Successful!</strong>
          <br>
            All details have been validated successfully.
        </div>

        <form id="regForm" novalidate>
          <div class="row">

            <div class="col-sm-6 field">
              <label for="fullName">Full Name</label>
              <input
                type="text"
                id="fullName"
                class="text-box"
                placeholder="Enter your full name"
                autocomplete="name"
              >
              <div class="err" id="errFullName"></div>
            </div>

            <div class="col-sm-6 field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                class="text-box"
                placeholder="you@example.com"
                autocomplete="email"
              >
              <div class="err" id="errEmail"></div>
            </div>

            <div class="col-sm-6 field">
              <label for="mobile">Mobile Number</label>
              <input 
                type="text" 
                id="mobile" class="text-box" 
                placeholder="10-digit number" 
                maxlength="10"
              >
              <div class="err" id="errMobile"></div>
            </div>

            <div class="col-sm-6 field d-none d-sm-block"></div>

            <div class="col-sm-6 field">
              <label for="password">Password</label>
              <input   
                type="password" 
                id="password" 
                class="text-box" 
                placeholder="Minimum 8 characters"
              >
              <div class="err" id="errPassword"></div>
            </div>

            <div class="col-sm-6 field">
              <label for="confirmPassword">Confirm Password</label>
              <input 
                type="password" 
                id="confirmPassword" 
                class="text-box" 
                placeholder="Re-enter password">
              <div class="err" id="errConfirmPassword"></div>
            </div>

          </div>

          <button type="submit" class="submit-btn">Register</button>
        </form>

      </div>

      <footer class="site-footer">
        <p>Made by Abishai Jaron &middot; <span id="yearNow"></span></p>
      </footer>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
